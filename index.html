  function shrinkImage(file,size,quality){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          try{
            const c=document.createElement("canvas");c.width=size;c.height=size;
            const ctx=c.getContext("2d");
            const s=Math.min(img.width,img.height);
            const sx=(img.width-s)/2, sy=(img.height-s)/2;
            ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
            resolve(c.toDataURL("image/jpeg",quality));
          }catch(e){reject(e)}
        };
        img.onerror=()=>reject(new Error("не удалось прочитать изображение"));
        img.src=reader.result;
      };
      reader.onerror=()=>reject(new Error("ошибка чтения файла"));
      reader.readAsDataURL(file);
    });
  }

      if(got===target)pyOK=true;
      else if(stripZero(got)===stripZero(target))pyOK=true;
      else if(noTone(got)===noTone(target)){pyOK=true;pyNoTone=true}
      else pyOK=false;
    }
    let ok;
    if(hzOK===null&&pyOK===null)ok=null;
    else ok=(hzOK!==false)&&(pyOK!==false);
    HISTORY[i]={hzRaw,pyRaw,hzOK,pyOK,pyNoTone,ok,done:true,self:null};
    done=true;self=null;
    renderResult();
    paintActions();
  };

  function renderHzResult(){
    const w=L[i];
    const H=HISTORY[i]||{};
    const hzRaw=H.hzRaw||"";
    const hzOK=H.hzOK;
    const drawn=cv&&cvReady&&!HIDE.cv;
    const H_self=H.self;

    if(drawn && hzOK===null){
      const boxClass = (H_self===null||H_self===undefined)?"":(H_self?"ok":"no");
      const btnYes = H_self===true ? "p" : "";
      const btnNo  = H_self===false ? "no-active" : "";
      const dis = (H_self===null||H_self===undefined)?"":"disabled";
      return `<div class="resultbox ${boxClass}" style="border-color:var(--bd);align-items:center">
        <span class="big">${w.h}</span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="b ${btnNo}" style="margin:0;width:auto;padding:6px 10px;${btnNo?'background:var(--no);color:#fff;border-color:var(--no)':''}" ${dis} onclick="__selfAns(false)">Нет</button>
          <button class="b ${btnYes}" style="margin:0;width:auto;padding:6px 10px;${btnYes?'background:var(--ac);color:#fff;border-color:var(--ac)':''}" ${dis} onclick="__selfAns(true)">Верно</button>
        </span>
      </div>`;
    }

    if(hzOK!==null){
      if(hzOK===true){
        return `<div class="resultbox ok">
          <span class="big">${normHz(hzRaw)}</span><span class="yes">✓</span>
        </div>`;
      }else{
        return `<div class="resultbox no">
          <span class="big ans">${normHz(hzRaw)||"—"}</span>
          <span class="arrow">→</span>
          <span class="big right">${w.h}</span>
        </div>`;
      }
    }

    if(!drawn){
      return `<div class="resultbox">
        <span class="big right">${w.h}</span>
      </div>`;
    }

    return `<div class="resultbox"><span class="big">${w.h}</span></div>`;
  }

  function renderPyResult(){
    const w=L[i];
    const H=HISTORY[i]||{};
    const pyRaw=H.pyRaw||"";
    const pyOK=H.pyOK;
    const pyNoTone=H.pyNoTone;
    const pyRight=w.s.map(mark).join(" ");

    if(pyOK!==null){
      if(pyOK===true){
        return `<div class="resultbox ok" style="margin-top:6px">
          <span class="big">${pyRaw.trim()||"—"}</span>
          <span class="yes">✓${pyNoTone?" (тоны не проверены)":""}</span>
        </div>`;
      }else{
        return `<div class="resultbox no" style="margin-top:6px">
          <span class="big ans">${pyRaw.trim()||"—"}</span>
          <span class="arrow">→</span>
          <span class="big right">${pyRight}</span>
        </div>`;
      }
    }

    if(pyRaw.trim()===""){
      return `<div class="resultbox" style="margin-top:6px">
        <span class="big right">${pyRight}</span>
      </div>`;
    }

    return `<div class="resultbox" style="margin-top:6px"><span class="big">${pyRight}</span></div>`;
  }

  function renderResult(){
    const slotHz=document.getElementById("hzSlot");
    const slotPy=document.getElementById("pySlot");
    if(slotHz)slotHz.innerHTML=renderHzResult();
    if(slotPy)slotPy.innerHTML=renderPyResult();

    const H=HISTORY[i]||{};
    const fb=document.getElementById("fb");
    if(fb){
      if(H.ok===true) fb.innerHTML=`<div class="r ok" style="margin:6px 0">Верно ✓</div>`;
      else if(H.ok===false) fb.innerHTML=`<div class="r no" style="margin:6px 0">Неверно ✗</div>`;
      else fb.innerHTML="";
    }
  }

  window.__selfAns=v=>{
    const w=L[i];
    const H=HISTORY[i]||{};
    const ok=(v===true);
    const prev=H.self;
    
    const q=P[w.h]||{s:0};
    if(ok){ q.s=Math.min(2,(q.s||0)+1); } else { q.s=0; }
    P[w.h]=q;

    const wasOk = (prev===true);
    if(wasOk && !ok) sc--;
    if(!wasOk && ok) sc++;

    wr = wr.filter(x=>x.h!==w.h);
    if(!ok) wr.push(w);

    H.self=v;H.ok=ok;H.done=true;
    HISTORY[i]=H;
    sv();
    renderResult();
  };

  window.__nx=()=>{
    const w=L[i];
    const H=HISTORY[i];
    if(!H||!H.done)return;
    if(H.self===null || H.self===undefined){
      if(H.hzOK===null && H.pyOK===null){
        const q=P[w.h]||{s:0};q.s=0;P[w.h]=q;wr.push(w);H.self=false;
      }else{
        const ok=(H.hzOK!==false)&&(H.pyOK!==false)&&(H.hzOK!==null||H.pyOK!==null);
        const q=P[w.h]||{s:0};q.s=ok?Math.min(2,q.s+1):0;P[w.h]=q;
        if(ok)sc++;else wr.push(w);
        H.self=ok;
      }
      sv();
    }
    i++;
    if(i<L.length)window.__show();else end();
  };
  window.__back=()=>{if(i<=0)return;i--;window.__show()};
  window.__forward=()=>{if(i>=L.length-1)return;i++;window.__show()};

  function end(){
    const wrongList = wr.slice();
    $.innerHTML=`<h1>Результат: ${sc} из ${L.length}</h1>
      ${wrongList.length?
        `<p>Повтори эти слова:</p>`+
        wrongList.map(w=>`<div class="r no"><span class="big">${w.h}</span> ${w.s.map(mark).join(" ")}<br>${w.ru}</div>`).join("")+
        `<button class="b p" onclick="__retryWrong()">Повторить ошибки</button>`
        :`<p>Без ошибок! 🎉</p>`}
      <button class="b" onclick="__home()">В начало</button>`;
  }

  window.__retryWrong=()=>{
    if(!wr.length){alert("Ошибок нет!");return}
    window.__go(wr.slice());
  };

  const CH=["零","一","二","三","四","五","六","七","八","九"];
  const PY={零:"ling2",一:"yi1",二:"er4",两:"liang3",三:"san1",四:"si4",五:"wu3",六:"liu4",七:"qi1",八:"ba1",九:"jiu3",十:"shi2",百:"bai3",千:"qian1"};
  const U1=["","один","два","три","четыре","пять","шесть","семь","восемь","девять"];
  const TE=["десять","одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать"];
  const TY=["","","двадцать","тридцать","сорок","пятьдесят","шестьдесят","семьдесят","восемьдесят","девяносто"];
  const HU=["","сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];
  function ruWords(n){const t=Math.floor(n/1000),h=Math.floor(n/100)%10,r=n%100;
   const th=t==1?"одна тысяча":t==2?"две тысячи":t==3?"три тысячи":t==4?"четыре тысячи":U1[t]+" тысяч";
   const rest=r<10?U1[r]:r<20?TE[r-10]:TY[Math.floor(r/10)]+(r%10?" "+U1[r%10]:"");
   return[th,HU[h],rest].filter(Boolean).join(" ")}
  function zhVariants(n){const d=[...String(n)].map(Number),t=[];
   t.push(d[0]==2?["两","二"]:[CH[d[0]]]);t.push(["千"]);
   if(d[1]){t.push(d[1]==2?["两","二"]:[CH[d[1]]]);t.push(["百"])}
   if(d[2]){if(!d[1])t.push(["零"]);t.push([CH[d[2]]]);t.push(["十"])}else if(d[3])t.push(["零"]);
   if(d[3])t.push([CH[d[3]]]);
   let v=[[]];t.forEach(o=>{v=v.flatMap(a=>o.map(x=>[...a,x]))});return v}
  let ND="cz",NS="d",nN=0,nOk=0,nTot=0,nDone=false;
  window.__numHome=()=>{nOk=0;nTot=0;nNew()};
  function nNew(){nN=1000+Math.floor(Math.random()*9000);nDone=false;nShow()}
  window.__nSet=x=>{ND=x;nNew()};
  window.__nStyle=x=>{NS=x;nNew()};
  function nShow(){
    const v=zhVariants(nN)[0],cz=ND=="cz";
    const q=cz?`<div class="big" style="margin:14px 0 6px">${v.join("")}</div><button class="b" onclick="__nHint()">Показать пиньинь</button><div id="nhint"></div>`
     :NS=="d"?`<div class="big" style="margin:14px 0">${nN}</div>`:`<div class="q" style="margin:14px 0">${ruWords(nN)}</div>`;
    $.innerHTML=`<div class="m"><span><b>Тренажёр чисел</b></span><span>верно: ${nOk} из ${nTot}</span></div>
    <div class="tn" style="margin:10px 0"><button class="${cz?"on":""}" onclick="__nSet('cz')">Кит → рус</button><button class="${cz?"":"on"}" onclick="__nSet('rz')">Рус → кит</button></div>
    ${cz?"":`<div class="tn" style="margin-bottom:6px"><button class="${NS=="d"?"on":""}" onclick="__nStyle('d')">Цифрами</button><button class="${NS=="w"?"on":""}" onclick="__nStyle('w')">Словами</button></div>`}
    ${q}
    <input type="text" id="na" placeholder="${cz?"Число цифрами":"Иероглифы или пиньинь"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="nfb"></div><button class="b p" id="nb" onclick="__nCheck()">Проверить</button><button class="b" onclick="__home()">В начало</button>`;
    const a=document.getElementById("na");a.onkeydown=e=>{if(e.key=="Enter")nDone?nNew():__nCheck()};a.focus();
  }
  window.__nHint=()=>{const v=zhVariants(nN)[0];document.getElementById("nhint").innerHTML=`<div class="r" style="border:1px solid var(--bd)">${v.map(c=>mark(PY[c])).join(" ")}</div>`};
  window.__nCheck=()=>{
    if(nDone)return;const a=document.getElementById("na"),raw=a.value.trim();if(!raw)return;
    const vs=zhVariants(nN);let ok=false,note="";
    if(ND=="cz"){ok=raw.replace(/[\s,.]/g,"")===String(nN)}
    else if(/[\u4e00-\u9fff]/.test(raw)){const t=raw.replace(/\s/g,"");ok=vs.some(x=>x.join("")===t)}
    else{
      const got=norm(raw);const targets=vs.map(x=>norm(x.map(c=>PY[c]).join(" ")));
      if(targets.some(t=>t===got))ok=true;
      else if(targets.some(t=>stripZero(t)===stripZero(got)))ok=true;
      else if(targets.some(t=>noTone(t)===noTone(got))){ok=true;note="тоны не проверены"}
      else ok=false;
    }
    nTot++;if(ok)nOk++;nDone=true;a.disabled=true;
    a.classList.remove("ok","no");a.classList.add(ok?"ok":"no");
    const v=vs[0],alt=vs.length>1?`<br><small>Допустимо также: ${vs.slice(1).map(x=>x.join("")).join(" / ")}</small>`:"";
    document.getElementById("nfb").innerHTML=`<div class="r ${ok?"ok":"no"}">${ok?"Верно ✓":"Неверно ✗"}${note?" <small>("+note+")</small>":""}<br><b>${nN}</b> — ${ruWords(nN)}<br><span class="big">${v.join("")}</span><br>${v.map(c=>mark(PY[c])).join(" ")}${alt}</div>`;
    const b=document.getElementById("nb");b.textContent="Дальше";b.onclick=nNew;
  };

  window.FB.onAuthStateChanged(window.FB.auth, async user=>{
    if(user){
      CURRENT_USER=user;
      await loadProgress(user.uid);
      ensureAutosort();
      dedupeX();
      home();
    }else{
      CURRENT_USER=null;
      authScreen();
    }
  });
};
</script>

<script>
(function waitStart(){
  if(typeof window.__startApp==="function"){window.__startApp()}
  else{setTimeout(waitStart,50)}
})();
</script>
</body></html>
