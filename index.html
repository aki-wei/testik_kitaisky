const U1=["","один","два","три","четыре","пять","шесть","семь","восемь","девять"];

const HU=["","сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];
function ruWords(n){const t=Math.floor(n/1000),h=Math.floor(n/100)%10,r=n%100;

 const rest=r<10?U1[r]:r<20?TE[r-10]:TY[Math.floor(r/10)]+(r%10?" "+U1[r%10]:"");
 return[th,HU[h],rest].filter(Boolean).join(" ")}
function zhVariants(n){const d=[...String(n)].map(Number),t=[];

 if(d[3])t.push([CH[d[3]]]);
